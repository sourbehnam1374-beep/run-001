<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>SHIVA · Diagram Families</title>
<link rel="stylesheet" href="_base.css">
<style>
  body { padding: 16px 22px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .fig {
    border: 1px solid var(--border); background: var(--chip);
    border-radius: 10px; padding: 10px;
  }
  .fig .k { font: 600 10px/1 var(--font-mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .fig svg { width: 100%; height: 84px; display: block; }
</style>
</head>
<body>
  <div class="grid">

    <div class="fig">
      <div class="k">Flow · L → R</div>
      <svg viewBox="0 0 480 90" role="img">
        <defs><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" class="arrow"/></marker></defs>
        <rect x="10"  y="26" width="92" height="38" rx="8" class="box flow"/><text x="56" y="49" class="label" text-anchor="middle">Ingest</text>
        <line x1="102" y1="45" x2="124" y2="45" class="edge anim-dash" marker-end="url(#m1)"/>
        <rect x="124" y="26" width="92" height="38" rx="8" class="box flow"/><text x="170" y="49" class="label" text-anchor="middle">Validate</text>
        <line x1="216" y1="45" x2="238" y2="45" class="edge anim-dash" marker-end="url(#m1)"/>
        <rect x="238" y="26" width="92" height="38" rx="8" class="box flow"/><text x="284" y="49" class="label" text-anchor="middle">Anchor</text>
        <line x1="330" y1="45" x2="352" y2="45" class="edge anim-dash" marker-end="url(#m1)"/>
        <rect x="352" y="26" width="92" height="38" rx="8" class="box flow"/><text x="398" y="49" class="label" text-anchor="middle">Publish</text>
      </svg>
    </div>

    <div class="fig">
      <div class="k">Stack · T → B</div>
      <svg viewBox="0 0 320 90" role="img">
        <rect x="60" y="6"  width="200" height="20" rx="4" class="box stack"/><text x="160" y="20" class="label" text-anchor="middle">Kernel</text>
        <rect x="60" y="28" width="200" height="20" rx="4" class="box stack"/><text x="160" y="42" class="label" text-anchor="middle">String</text>
        <rect x="60" y="50" width="200" height="20" rx="4" class="box stack"/><text x="160" y="64" class="label" text-anchor="middle">Rope</text>
        <rect x="60" y="72" width="200" height="14" rx="4" class="box stack"/><text x="160" y="83" class="label" text-anchor="middle">Sheet · Snake · ∞</text>
      </svg>
    </div>

    <div class="fig">
      <div class="k">Graph · radial</div>
      <svg viewBox="0 0 320 90" role="img">
        <g style="transform-origin:160px 45px">
          <line x1="160" y1="45" x2="220" y2="20" class="edge moving"/>
          <line x1="160" y1="45" x2="230" y2="60" class="edge moving"/>
          <line x1="160" y1="45" x2="180" y2="84" class="edge moving"/>
          <line x1="160" y1="45" x2="100" y2="20" class="edge moving"/>
          <line x1="160" y1="45" x2="90"  y2="60" class="edge moving"/>
          <line x1="160" y1="45" x2="140" y2="84" class="edge moving"/>
          <circle cx="220" cy="20" r="6" class="node"/>
          <circle cx="230" cy="60" r="6" class="node mark"/>
          <circle cx="180" cy="84" r="6" class="node"/>
          <circle cx="100" cy="20" r="6" class="node mark"/>
          <circle cx="90"  cy="60" r="6" class="node"/>
          <circle cx="140" cy="84" r="6" class="node"/>
          <circle cx="160" cy="45" r="14" class="node core"/>
        </g>
      </svg>
    </div>

    <div class="fig">
      <div class="k">Ladder · 5 rungs</div>
      <svg viewBox="0 0 320 90" role="img">
        <defs><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" class="arrow"/></marker></defs>
        <rect x="100" y="2"  width="120" height="14" rx="3" class="box stack"/><text x="160" y="12" class="label" text-anchor="middle" style="font-size:9px">Observe</text>
        <line x1="160" y1="16" x2="160" y2="20" class="edge" marker-end="url(#m2)"/>
        <rect x="100" y="22" width="120" height="14" rx="3" class="box stack"/><text x="160" y="32" class="label" text-anchor="middle" style="font-size:9px">Hypothesize</text>
        <line x1="160" y1="36" x2="160" y2="40" class="edge" marker-end="url(#m2)"/>
        <rect x="100" y="42" width="120" height="14" rx="3" class="box stack"/><text x="160" y="52" class="label" text-anchor="middle" style="font-size:9px">Model</text>
        <line x1="160" y1="56" x2="160" y2="60" class="edge" marker-end="url(#m2)"/>
        <rect x="100" y="62" width="120" height="14" rx="3" class="box stack"/><text x="160" y="72" class="label" text-anchor="middle" style="font-size:9px">Check</text>
        <line x1="160" y1="76" x2="160" y2="80" class="edge" marker-end="url(#m2)"/>
        <rect x="100" y="82" width="120" height="6" rx="3" class="box stack"/>
      </svg>
    </div>

  </div>
</body>
</html>
