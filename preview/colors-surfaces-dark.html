<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>SHIVA · Surfaces (Dark)</title>
<link rel="stylesheet" href="_base.css">
<style>
  body { padding: 18px 22px; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
</style>
</head>
<body>
  <div class="grid">
    <div class="swatch"><div class="chip" style="background:#0a0d12"></div><div class="meta">--bg<small>#0A0D12</small></div></div>
    <div class="swatch"><div class="chip" style="background:#0d1117"></div><div class="meta">--panel<small>#0D1117</small></div></div>
    <div class="swatch"><div class="chip" style="background:#151b23"></div><div class="meta">--panel-2<small>#151B23</small></div></div>
    <div class="swatch"><div class="chip" style="background:#0b1220"></div><div class="meta">--chip<small>#0B1220</small></div></div>
    <div class="swatch"><div class="chip" style="background:#02060e; border-right:1px solid #1e293b;"></div><div class="meta">--surface<small>#02060E</small></div></div>
  </div>
</body>
</html>
