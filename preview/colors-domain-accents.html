<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>SHIVA · Domain Accents</title>
<link rel="stylesheet" href="_base.css">
<style>
  body { padding: 16px 22px; }
  .list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px 16px; }
  .row {
    display: grid; grid-template-columns: 84px 1fr 60px; gap: 8px; align-items: center;
    font: 11px/1.5 var(--font-mono);
    color: var(--muted);
  }
  .row .name { color: var(--text); font: 600 11px/1 var(--font-mono); letter-spacing: 0.04em; }
  .stripe { height: 6px; border-radius: 3px; }
  .hex { text-align: right; font-size: 10.5px; }
</style>
</head>
<body>
  <div class="list">
    <div class="row cat-data">    <span class="name">data</span>     <div class="stripe"></div> <span class="hex">#60A5FA</span></div>
    <div class="row cat-scitech"> <span class="name">scitech</span>  <div class="stripe"></div> <span class="hex">#34D399</span></div>
    <div class="row cat-code">    <span class="name">code</span>     <div class="stripe"></div> <span class="hex">#A78BFA</span></div>
    <div class="row cat-images">  <span class="name">images</span>   <div class="stripe"></div> <span class="hex">#F59E0B</span></div>
    <div class="row cat-media">   <span class="name">media</span>    <div class="stripe"></div> <span class="hex">#22C55E</span></div>
    <div class="row cat-archive"> <span class="name">archive</span>  <div class="stripe"></div> <span class="hex">#38BDF8</span></div>
    <div class="row cat-docs">    <span class="name">docs</span>     <div class="stripe"></div> <span class="hex">#F472B6</span></div>
    <div class="row cat-security"><span class="name">security</span> <div class="stripe"></div> <span class="hex">#EF4444</span></div>
    <div class="row cat-sim">     <span class="name">sim</span>      <div class="stripe"></div> <span class="hex">#F97316</span></div>
    <div class="row cat-webai">   <span class="name">webai</span>    <div class="stripe"></div> <span class="hex">#06B6D4</span></div>
  </div>
</body>
</html>
