<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>SHIVA · Iconography</title>
<link rel="stylesheet" href="_base.css">
<style>
  body { padding: 16px 22px; }
  .grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; }
  .ic {
    border: 1px solid var(--border);
    background: var(--chip);
    border-radius: 10px;
    padding: 10px 6px;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    color: var(--text);
  }
  .ic img { width: 22px; height: 22px; filter: invert(86%) sepia(8%) saturate(229%) hue-rotate(177deg) brightness(97%) contrast(90%); }
  .ic .nm { font: 600 9.5px/1 var(--font-mono); color: var(--muted); letter-spacing: 0.04em; }
</style>
</head>
<body>
  <div class="grid">
    <div class="ic"><img src="../assets/icon-kernel.svg" alt=""><span class="nm">kernel</span></div>
    <div class="ic"><img src="../assets/icon-string.svg" alt=""><span class="nm">string</span></div>
    <div class="ic"><img src="../assets/icon-rope.svg" alt=""><span class="nm">rope</span></div>
    <div class="ic"><img src="../assets/icon-sheet.svg" alt=""><span class="nm">sheet</span></div>
    <div class="ic"><img src="../assets/icon-snake.svg" alt=""><span class="nm">snake</span></div>
    <div class="ic"><img src="../assets/icon-infinity.svg" alt=""><span class="nm">infinity</span></div>
    <div class="ic"><img src="../assets/icon-anchor.svg" alt=""><span class="nm">anchor</span></div>
    <div class="ic"><img src="../assets/icon-seal.svg" alt=""><span class="nm">seal</span></div>

    <div class="ic"><img src="../assets/icon-ledger.svg" alt=""><span class="nm">ledger</span></div>
    <div class="ic"><img src="../assets/icon-vault.svg" alt=""><span class="nm">vault</span></div>
    <div class="ic"><img src="../assets/icon-graph.svg" alt=""><span class="nm">graph</span></div>
    <div class="ic"><img src="../assets/icon-studio.svg" alt=""><span class="nm">studio</span></div>
    <div class="ic"><img src="../assets/icon-search.svg" alt=""><span class="nm">search</span></div>
    <div class="ic"><img src="../assets/icon-settings.svg" alt=""><span class="nm">settings</span></div>
    <div class="ic"><img src="../assets/icon-chevron-down.svg" alt=""><span class="nm">chevron</span></div>
    <div class="ic"><img src="../assets/icon-arrow-right.svg" alt=""><span class="nm">arrow</span></div>
  </div>
</body>
</html>
