<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>SHIVA · Surfaces (Light)</title>
<link rel="stylesheet" href="_base.css">
<style>
  body { padding: 18px 22px; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
</style>
</head>
<body>
  <div class="grid">
    <div class="swatch"><div class="chip" style="background:#f9fafb"></div><div class="meta">--bg<small>#F9FAFB</small></div></div>
    <div class="swatch"><div class="chip" style="background:#ffffff"></div><div class="meta">--panel<small>#FFFFFF</small></div></div>
    <div class="swatch"><div class="chip" style="background:#f1f5f9"></div><div class="meta">--panel-2<small>#F1F5F9</small></div></div>
    <div class="swatch"><div class="chip" style="background:#f8fafc"></div><div class="meta">--chip<small>#F8FAFC</small></div></div>
    <div class="swatch"><div class="chip" style="background:#ffffff; border-right:1px solid #e5e7eb;"></div><div class="meta">--surface<small>#FFFFFF</small></div></div>
  </div>
</body>
</html>
