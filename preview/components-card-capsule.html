<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>SHIVA · Card &amp; Capsule</title>
<link rel="stylesheet" href="_base.css">
<style>
  body { padding: 18px 22px; }
  .grid { display: grid; grid-template-columns: 1fr 1.4fr; gap: 14px; align-items: stretch; }
  .card h3 { margin: 0 0 4px; font: 650 13px/1.2 var(--font-sans); letter-spacing: -0.01em; }
  .card .meta { font: 11px/1 var(--font-mono); color: var(--muted); margin-bottom: 8px; }
  .card .rule {
    font: 11px/1.4 var(--font-mono); color: var(--muted);
    border-top: 1px dashed var(--border); padding-top: 6px; margin-top: 8px;
  }
  .capsule .k {
    display: inline-block; font: 600 10.5px/1 var(--font-mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px;
  }
  .capsule .h { font: 650 16px/1.2 var(--font-sans); letter-spacing: -0.02em; margin: 0 0 6px; }
  .capsule .p { font: 12.5px/1.5 var(--font-sans); margin: 0; }
  .glyph { display: block; text-align: center; margin-top: 10px; color: var(--muted); letter-spacing: 6px; font-size: 14px; }
</style>
</head>
<body>
  <div class="grid">
    <div class="card">
      <h3>Pelvic Ratio R</h3>
      <div class="meta">static · sealed</div>
      <div>ICC_avg6 0.815 across 29 images.</div>
      <div class="rule">render · gradient bars · nested shapes</div>
    </div>
    <div class="capsule" style="padding:14px 16px;">
      <span class="k">Clinical Integrity Capsule</span>
      <div class="h">Reliability Sub-study</div>
      <p class="p">Single-rater test–retest across 29 lateral radiographs. SEM 0.113 · MDC95 0.312.</p>
      <span class="glyph">〰️ ➰ ♾️</span>
    </div>
  </div>
</body>
</html>
