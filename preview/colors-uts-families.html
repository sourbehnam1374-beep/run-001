<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>SHIVA · UTS Families</title>
<link rel="stylesheet" href="_base.css">
<style>
  body { padding: 18px 22px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .fam {
    border: 1px solid var(--border);
    background: var(--chip);
    border-radius: 12px;
    padding: 12px;
    border-left: 4px solid var(--accent);
  }
  .fam .swatch { height: 28px; border-radius: 6px; background: var(--accent); margin-bottom: 8px; }
  .fam .name { font: 650 14px/1 var(--font-sans); letter-spacing: -0.01em; }
  .fam .role { font: 400 11px/1.4 var(--font-sans); color: var(--muted); margin-top: 4px; }
  .fam .hex  { font: 600 10.5px/1 var(--font-mono); color: var(--muted); letter-spacing: 0.04em; margin-top: 6px; }
</style>
</head>
<body>
  <div class="grid">
    <div class="fam" data-family="static">
      <div class="swatch"></div>
      <div class="name">Static</div>
      <div class="role">intrinsic descriptors</div>
      <div class="hex">#2563EB</div>
    </div>
    <div class="fam" data-family="dynamic">
      <div class="swatch"></div>
      <div class="name">Dynamic</div>
      <div class="role">flow · rhythm · energy</div>
      <div class="hex">#EA580C</div>
    </div>
    <div class="fam" data-family="relational">
      <div class="swatch"></div>
      <div class="name">Relational</div>
      <div class="role">direction · balance · ratio</div>
      <div class="hex">#16A34A</div>
    </div>
    <div class="fam" data-family="vital">
      <div class="swatch"></div>
      <div class="name">Vital</div>
      <div class="role">growth · decay · entropy</div>
      <div class="hex">#9333EA</div>
    </div>
  </div>
</body>
</html>
