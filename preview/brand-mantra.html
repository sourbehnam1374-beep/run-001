<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>SHIVA · Mantra</title>
<link rel="stylesheet" href="_base.css">
<style>
  body { padding: 24px 28px; }
  .mantra-card {
    background: var(--capsule-bg);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 18px 22px;
  }
  .one { font: 650 22px/1.25 var(--font-sans); letter-spacing: -0.02em; }
  .two { font: 400 13px/1.4 var(--font-sans); color: var(--muted); margin-top: 6px; letter-spacing: 0.02em; }
  .glyph { font-size: 18px; letter-spacing: 8px; margin-top: 12px; display: block; color: var(--muted); }
</style>
</head>
<body>
  <div class="mantra-card">
    <div class="one">Strings → Ropes → Sheets → Snakes → ∞</div>
    <div class="two">Determinism · Provenance · Governance · Inspectable Structure</div>
    <span class="glyph">〰️ ➰ ♾️</span>
  </div>
</body>
</html>
