<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>SHIVA · Radii</title>
<link rel="stylesheet" href="_base.css">
<style>
  body { padding: 18px 22px; }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  .r { background: var(--chip); border: 1px solid var(--border); height: 48px; display: flex; align-items: center; justify-content: center; font: 600 11px/1 var(--font-mono); color: var(--text); }
  .meta { font: 11px/1.3 var(--font-mono); color: var(--muted); margin-top: 6px; text-align: center; }
  .meta small { display: block; color: var(--text); font: 600 11px/1.4 var(--font-mono); margin-top: 2px; letter-spacing: 0.02em; }
</style>
</head>
<body>
  <div class="grid">
    <div><div class="r" style="border-radius:6px">6</div>  <div class="meta">--r-xs<small>card seam</small></div></div>
    <div><div class="r" style="border-radius:8px">8</div>  <div class="meta">--r-sm<small>token</small></div></div>
    <div><div class="r" style="border-radius:12px">12</div><div class="meta">--r-card<small>card</small></div></div>
    <div><div class="r" style="border-radius:14px">14</div><div class="meta">--r-section<small>section</small></div></div>
    <div><div class="r" style="border-radius:16px">16</div><div class="meta">--r-hash<small>hash · capsule body</small></div></div>
    <div><div class="r" style="border-radius:18px">18</div><div class="meta">--r-hero<small>capsule outer</small></div></div>
  </div>
</body>
</html>
