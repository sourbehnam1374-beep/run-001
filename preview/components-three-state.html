<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>SHIVA · Three-State Figure</title>
<link rel="stylesheet" href="_base.css">
<style>
  body { padding: 18px 22px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .state-label { font: 600 10px/1 var(--font-mono); letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; display: block; }
  figure.shiva svg { width: 100%; height: 64px; }
  figure.shiva.print { box-shadow: 0 4px 18px rgba(0,0,0,.28); border-color: var(--border)!important; }
  figure.shiva.print:hover { box-shadow: 0 4px 18px rgba(0,0,0,.28); border-color: var(--border); }
</style>
</head>
<body>
  <div class="grid">
    <div>
      <span class="state-label">01 · Rest</span>
      <figure class="shiva" tabindex="0">
        <svg viewBox="0 0 200 80" role="img" aria-label="rest"><defs><marker id="ra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" class="arrow"/></marker></defs>
          <rect x="20" y="20" width="50" height="40" rx="8" class="box"/>
          <rect x="130" y="20" width="50" height="40" rx="8" class="box"/>
          <line x1="70" y1="40" x2="130" y2="40" class="edge" marker-end="url(#ra)"/>
        </svg>
        <figcaption>edges muted · no lift</figcaption>
      </figure>
    </div>
    <div>
      <span class="state-label">02 · Hover</span>
      <figure class="shiva" tabindex="0" style="border-color:var(--accent); box-shadow:var(--shadow-hover);">
        <svg viewBox="0 0 200 80" role="img" aria-label="hover"><defs><marker id="rb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="var(--accent)"/></marker></defs>
          <rect x="20" y="20" width="50" height="40" rx="8" class="box"/>
          <rect x="130" y="20" width="50" height="40" rx="8" class="box"/>
          <line x1="70" y1="40" x2="130" y2="40" stroke="var(--accent)" stroke-width="1.6" class="anim-dash" stroke-dasharray="6 8" marker-end="url(#rb)"/>
        </svg>
        <figcaption>edges → accent · shadow lifts</figcaption>
      </figure>
    </div>
    <div>
      <span class="state-label">03 · Print</span>
      <figure class="shiva print" tabindex="0" style="background:#fff; border-color:#0a0d12;">
        <svg viewBox="0 0 200 80" role="img" aria-label="print"><defs><marker id="rc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#0a0d12"/></marker></defs>
          <rect x="20" y="20" width="50" height="40" rx="8" fill="none" stroke="#0a0d12" stroke-width="1.4"/>
          <rect x="130" y="20" width="50" height="40" rx="8" fill="none" stroke="#0a0d12" stroke-width="1.4"/>
          <line x1="70" y1="40" x2="130" y2="40" stroke="#0a0d12" stroke-width="1.4" marker-end="url(#rc)"/>
        </svg>
        <figcaption style="color:#475569;">anim disabled · pure vector</figcaption>
      </figure>
    </div>
  </div>
</body>
</html>
