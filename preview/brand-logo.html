<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>SHIVA · Logo</title>
<link rel="stylesheet" href="_base.css">
<style>
  body { padding: 24px 26px; }
  .ring {
    display: flex; align-items: center; gap: 28px;
  }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .item code { font: 600 10.5px/1 var(--font-mono); color: var(--muted); letter-spacing: 0.04em; }
  .wordmark {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 14px 8px 10px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--chip);
  }
  .wordmark .t { font: 650 15px/1 var(--font-sans); letter-spacing: -0.01em; }
</style>
</head>
<body>
  <div class="ring">
    <div class="item"><span class="shiva-logo" style="width:12px;height:12px;"></span><code>12 · header</code></div>
    <div class="item"><span class="shiva-logo" style="width:18px;height:18px;"></span><code>18 · brand row</code></div>
    <div class="item"><span class="shiva-logo" style="width:28px;height:28px;"></span><code>28 · hero</code></div>
    <div class="item"><span class="shiva-logo" style="width:48px;height:48px;"></span><code>48 · capsule</code></div>
    <div class="item">
      <span class="wordmark"><span class="shiva-logo" style="width:14px;height:14px;"></span><span class="t">SHIVA</span></span>
      <code>wordmark lockup</code>
    </div>
  </div>
</body>
</html>
